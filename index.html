<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ash & Ember — Cigar Companion</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1c1410" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #1c1410; font-family: Georgia, serif; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #4a3626; border-radius: 3px; }
  button { font-family: inherit; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid rgba(237,228,211,0.25); }
  .tag { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: #2a1f18; border: 1px solid #4a3626; color: #d9c9a8; font-family: 'JetBrains Mono', monospace; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }
  #fallback { color: #a9967a; font-size: 13px; padding: 40px 20px; text-align: center; }
</style>
</head>
<body>
<div id="root"><div id="fallback">Loading Ash &amp; Ember…</div></div>
<script src="bundle.js"></script>
</body>
</html>
